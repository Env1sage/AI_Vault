[project]
name = "vault-shared"
version = "0.1.0"
description = "Cross-cutting Python code shared by apps/backend and apps/worker: settings, structured logging, typed errors, the DB layer (models/repositories/session), token encryption, and the Google Workspace connector's OAuth client + token-refresh service — anything both apps must access identically (Handbook §8.15)."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    # Phase 10 (ADR-022) bumped the floor to 50.0.0 to clear CVE-2026-69247.
    "cryptography>=50,<51",
    "requests>=2.32,<3",
    # AI Gateway (Phase 6, Handbook §8.14) — local, free, offline embedding
    # provider (ADR-018). Lives here, not in a per-app requirements.txt,
    # because both apps/backend (embedding a user's search query at request
    # time) and apps/worker (embedding documents in the background) need it.
    # gensim (pretrained GloVe word vectors, averaged per document), not
    # sentence-transformers — this environment's platform (an old macOS)
    # has zero available wheels for torch or onnxruntime, ruling out every
    # transformer-based local embedding library; gensim's pure numpy/scipy
    # stack is the one that actually installs here. See ADR-018.
    "gensim>=4.3,<5",
    # Automation Engine (Phase 9) — cron-expression parsing for scheduled
    # workflow triggers (ADR-021). Pure Python, no wheel-compatibility
    # concerns like the transformer libraries ADR-018 ruled out.
    "croniter>=2.0,<7",
    # Observability (Phase 10, ADR-022). `prometheus-client`/OTel
    # tracing/Sentry live here (not per-app) because both apps emit the
    # same metric names and both need `configure_tracing`/`configure_sentry`
    # — the app-specific instrumentation packages (FastAPI/SQLAlchemy/Celery
    # auto-instrumentors) stay in each app's own requirements.txt.
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "sentry-sdk[fastapi,celery]>=2.0,<3",
    # Archive MVP — S3-compatible client for the archive object store.
    # boto3 (not a MinIO-specific SDK) so local dev (MinIO via endpoint_url)
    # and prod (real S3, matching Terraform's existing backups bucket) share
    # one client implementation.
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-croniter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vault_shared*"]

[tool.ruff]
extend = "../config/python/ruff.toml"
