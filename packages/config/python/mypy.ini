[mypy]
# 3.12, not 3.11 (the project's `requires-python` floor) — numpy's own
# type stubs (a Phase 6 AI Gateway dependency) use PEP 695 `type` alias
# syntax that mypy can only parse when its own target is 3.12+. This
# doesn't relax what Python version application code may assume; it only
# changes what stdlib/third-party stub syntax mypy itself understands
# while checking it, and every app's actual runtime is 3.13 regardless.
python_version = 3.12
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True
